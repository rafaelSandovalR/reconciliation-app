<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS // RECONCILIATION TERMINAL</title>
    <style>
        :root {
            --bg-color: #050505; /* Obsidian Black */
            --term-color: #ffb000; /* Wallace Amber */
            --term-dim: #7a5c00;
            --alert-color: #ff3333;
            --success-color: #00ff66;
            --border-style: 1px solid var(--term-dim);
            --font-mono: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--term-color);
            font-family: var(--font-mono);
            height: 100vh;
            display: flex;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* SPLIT PANE LAYOUT */
        .panel-left {
            width: 33.33%;
            border-right: var(--border-style);
            display: flex;
            flex-direction: column;
            padding: 30px;
            justify-content: space-between;
        }

        .panel-right {
            width: 66.67%;
            display: flex;
            flex-direction: column;
            padding: 30px;
            background: #020202; /* Slightly darker for depth */
        }

        /* TYPOGRAPHY & HEADINGS */
        h1, h2 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            border-bottom: var(--border-style);
            padding-bottom: 15px;
            margin-bottom: 25px;
            font-weight: normal;
        }

        /* DROPZONE (UNIVERSAL UPLOAD) */
        .dropzone-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .dropzone {
            border: 1px dashed var(--term-color);
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .dropzone:hover, .dropzone.dragover {
            background: rgba(255, 176, 0, 0.1);
            box-shadow: inset 0 0 15px rgba(255, 176, 0, 0.2);
        }

        .dropzone input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .dropzone p {
            font-size: 0.9rem;
            line-height: 1.5;
            letter-spacing: 1px;
        }

        /* BUTTONS */
        .btn {
            background: transparent;
            color: var(--term-color);
            border: 1px solid var(--term-color);
            padding: 18px;
            width: 100%;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
            text-transform: uppercase;
        }

        .btn:hover {
            background: var(--term-color);
            color: var(--bg-color);
        }

        /* CONSOLE OUTPUT */
        .console-window {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
            padding-right: 15px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); border-left: var(--border-style); }
        ::-webkit-scrollbar-thumb { background: var(--term-dim); }
        ::-webkit-scrollbar-thumb:hover { background: var(--term-color); }

        /* Log Line Styling */
        .log-line { margin-bottom: 6px; display: flex; }
        .log-time { color: var(--term-dim); margin-right: 15px; white-space: nowrap; }
        .log-msg { word-wrap: break-word; }
        .log-msg.error { color: var(--alert-color); }
        .log-msg.success { color: var(--success-color); }

        .blinking-cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: var(--term-color);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    </style>
</head>
<body>

<!-- LEFT PANEL: CONTROLS -->
<div class="panel-left">
    <div>
        <h1>UPLOAD FILE</h1>
        <div class="dropzone-container">
            <div class="dropzone" id="dropzone">
                <input type="file" id="universalFile" accept=".xlsx" />
                <p>DRAG & DROP LEDGER FILE HERE</p>
                <p style="color: var(--term-dim); margin-top: 10px; font-size: 0.75rem;">
                    [ AUTO-DETECT: RITHUM | WALMART | AMAZON ]
                </p>
            </div>
        </div>
    </div>

    <div>
        <button class="btn" onclick="downloadMaster()">Download Master Export</button>
    </div>
</div>

<!-- RIGHT PANEL: CONSOLE LOG -->
<div class="panel-right">
    <h2>APEX RECONCILIATION // PROCESS STREAM</h2>
    <div class="console-window" id="consoleWindow">
        <!-- Initial System Boot Message -->
        <div class="log-line">
            <span class="log-time" id="bootTime"></span>
            <span class="log-msg">SYSTEM INITIALIZED. AWAITING DATA INPUT...</span>
        </div>
    </div>
    <div style="margin-top: 15px; color: var(--term-color);">
        > <span class="blinking-cursor"></span>
    </div>
</div>

<script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('universalFile');
    const consoleWindow = document.getElementById('consoleWindow');

    // Set Initial Boot Time
    document.getElementById('bootTime').textContent = getFormattedTime();

    // --- UI LOGIC: DRAG AND DROP ---
    dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            processFile(fileInput.files[0]);
        }
    });

    fileInput.addEventListener('change', function() {
        if (this.files.length) {
            processFile(this.files[0]);
        }
    });

    // --- CORE LOGIC: FILE UPLOAD ---
    async function processFile(file) {
        logToConsole(`INITIATING UPLOAD: ${file.name}`);

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch('/api/reconciliation/upload', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const contentType = response.headers.get('Content-Type');

                if (contentType && contentType.includes('spreadsheetml')) {
                    // SCENARIO B: Exception Receipt
                    await triggerDownload(response, 'exceptions_receipt.xlsx');
                    logToConsole(`PROCESSING COMPLETE WITH SUSPENSE ITEMS. RECEIPT DOWNLOADED.`, 'error');
                } else {
                    // SCENARIO A: Text Success (e.g., Rithum)
                    const resultText = await response.text();

                    // Split the backend print statements by newline to make it look like a real terminal
                    const lines = resultText.split('\n').filter(line => line.trim() !== '');
                    lines.forEach(line => logToConsole(line, 'success'));
                }
            } else {
                const errorText = await response.text();
                logToConsole(`ERR: ${errorText}`, 'error');
            }
        } catch (error) {
            logToConsole(`CRITICAL FAILURE: NETWORK DISCONNECT`, 'error');
        }

        // Reset file input so you can upload the same file again if needed
        fileInput.value = '';
    }

    // --- CORE LOGIC: DOWNLOAD MASTER ---
    function downloadMaster() {
        logToConsole('COMPILING MASTER FINANCIAL LEDGER...');
        window.location.href = '/api/reconciliation/export';
        setTimeout(() => {
            logToConsole('EXPORT COMMAND TRANSMITTED.', 'success');
        }, 1000);
    }

    // --- HELPERS: TERMINAL LOGGING ---
    async function triggerDownload(response, fallbackName) {
        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = downloadUrl;

        let filename = fallbackName;
        const disposition = response.headers.get('Content-Disposition');
        if (disposition && disposition.includes('filename=')) {
            filename = disposition.split('filename=')[1].replace(/['"]/g, '');
        }

        a.download = filename;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(downloadUrl);
        a.remove();
    }

    function logToConsole(message, type = 'normal') {
        const line = document.createElement('div');
        line.className = 'log-line';

        const time = document.createElement('span');
        time.className = 'log-time';
        time.textContent = getFormattedTime();

        const text = document.createElement('span');
        text.className = `log-msg ${type}`;
        text.textContent = message;

        line.appendChild(time);
        line.appendChild(text);
        consoleWindow.appendChild(line);

        // Auto-scroll to bottom
        consoleWindow.scrollTop = consoleWindow.scrollHeight;
    }

    function getFormattedTime() {
        const now = new Date();
        return `[${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}]`;
    }
</script>
</body>
</html>
